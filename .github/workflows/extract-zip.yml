name: Extract bundled app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'chore: extract vite-react-tsx-app.zip [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive
        run: |
          set -euo pipefail
          rm -rf .extract-tmp
          mkdir .extract-tmp
          unzip -o vite-react-tsx-app.zip -d .extract-tmp
          src=".extract-tmp/vite-react-tsx-app"
          test -d "$src"
          cp -R "$src"/. .
          rm -rf .extract-tmp
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "chore: extract vite-react-tsx-app.zip [skip ci]"
          git push
